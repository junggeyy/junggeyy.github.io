<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lekha — notes on environments, systems, policy, and the quiet consequences of everyday life.">
    <title>Lekha by junggeyy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..500&family=Noto+Serif+Devanagari:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FXQHH6YSY9"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-FXQHH6YSY9', {
            'content_group': 'Lekha'
        });
    </script>
</head>
<body class="home-page">
    <main class="home-shell">
        <header class="masthead">
            <h1 lang="ne">लेख</h1>
            <p class="byline">by junggeyy</p>
            <p class="purpose">reflections | perceptions | thoughts</p>
        </header>

        <section class="writing-index" aria-labelledby="writing-heading">
            <div class="index-heading">
                <h2 id="writing-heading">Writings</h2>
                <button
                    type="button"
                    class="notification-toggle"
                    aria-expanded="false"
                    aria-controls="notification-signup"
                >Notify Me</button>
            </div>
            <ol class="article-list">
                <li>
                    <a href="articles/the-cost-of-one-degree/">
                        <div>
                            <h3>the cost of 1°</h3>
                            <p>Everyday convenience we rarely question</p>
                        </div>
                        <time datetime="2026-09-26">Sep 26, 2026</time>
                    </a>
                </li>
            </ol>
            <div class="notification-signup-content" id="notification-signup" hidden>
                <h3>Get notified when a new article drops</h3>
                <div class="emailoctopus-form-embed">
                    <script async src="https://eomail5.com/form/5bb78826-baa9-11f1-a89b-2345e5741418.js" data-form="5bb78826-baa9-11f1-a89b-2345e5741418"></script>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p><b>Creator:  </b><a href="https://junggeyy.github.io/" target="_blank">junggeyy.github.io</a></p>
    </footer>
    <script>
        const notificationToggle = document.querySelector('.notification-toggle');
        const notificationSignup = document.getElementById('notification-signup');

        notificationToggle.addEventListener('click', () => {
            const isExpanded = notificationToggle.getAttribute('aria-expanded') === 'true';
            notificationToggle.setAttribute('aria-expanded', String(!isExpanded));
            notificationSignup.hidden = isExpanded;
        });
    </script>
</body>
</html>
